services:
  - type: web
    name: websocket-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: HTTP_PORT
        value: 8083
      - key: GRPC_PORT
        value: 9093
      - key: ENVIRONMENT
        value: production
    ports:
      - port: 8083
        protocol: http
      - port: 9093
        protocol: tcp
    headers:
      - path: /*
        name: Upgrade
        value: $http_upgrade
      - path: /*
        name: Connection
        value: $connection_upgrade
    autoDeploy: true 